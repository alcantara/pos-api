name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}
            type=sha,prefix=-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke:
    name: Smoke test the published image
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the image and wait for health
        run: |
          docker run -d --name pos-smoke -p 3000:3000 \
            -e DATABASE_URL=file:./smoke.db \
            -e COOKIE_SECRET=smoke-test-secret-smoke-test-secret-0123 \
            -e NODE_ENV=production \
            "$IMAGE:${{ github.event.inputs.tag || github.ref_name }}"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/health; then
              echo "health check passed"
              docker rm -f pos-smoke
              exit 0
            fi
            sleep 2
          done
          echo "health check never passed"
          docker logs pos-smoke
          docker rm -f pos-smoke
          exit 1
